<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --crust: #3E2A1E; --crust-2: #4F3625; --flour: #FBF7EF; --crumb: #EFE4CE; --crumb-2: #E3D4B4;
    --ink: #2B211A; --ink-soft: #6B5D4E; --wheat: #C68A1A; --wheat-dark: #9C6B0E;
    --jam: #A13D2C; --jam-soft: #F3DED8; --sage: #5C7A52; --sage-soft: #E1E9DA;
    --border: #DCCBA6; --shadow: 0 2px 10px rgba(62,42,30,0.08); --radius: 10px;
    font-family: 'Inter', system-ui, sans-serif;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --flour: #211A13; --crumb: #2C2319; --crumb-2: #362B1E; --ink: #F1E7D6;
      --ink-soft: #C2AD8E; --border: #4A3B26; --crust: #17110B; --crust-2: #221A11;
    }
  }
  :root[data-theme="dark"] {
    --flour: #211A13; --crumb: #2C2319; --crumb-2: #362B1E; --ink: #F1E7D6;
    --ink-soft: #C2AD8E; --border: #4A3B26; --crust: #17110B; --crust-2: #221A11;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--flour); color: var(--ink); min-height: 100vh; }
  ::selection { background: var(--wheat); color: #fff; }

  header.top {
    background: var(--crust); color: var(--flour); padding: 14px 22px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    position: sticky; top: 0; z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { font-size: 24px; }
  .brand h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; margin: 0; }
  nav.tabs { display: flex; gap: 4px; background: rgba(0,0,0,0.18); padding: 4px; border-radius: 9px; flex-wrap: wrap; }
  nav.tabs button {
    background: transparent; border: none; color: #E9DCC3; padding: 7px 13px; border-radius: 6px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  nav.tabs button.active { background: var(--wheat); color: #2B1D08; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .whoami { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); border-radius: 20px; padding: 4px 6px 4px 12px; font-size: 12.5px; color: #E9DCC3; }
  .whoami .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--wheat); color: #2B1D08; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .whoami button { background: none; border: none; color: #C9B590; font-size: 11px; cursor: pointer; text-decoration: underline; font-family: inherit; }
  .icon-btn { background: none; border: none; color: #E9DCC3; font-size: 16px; cursor: pointer; padding: 4px 6px; }
  .sync-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: #C9B590; }
  .sync-dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); display: inline-block; }
  .sync-dot.offline i { background: var(--jam); }

  main { max-width: 1220px; margin: 0 auto; padding: 24px 18px 80px; }

  .layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--crumb); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .panel h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin: 0 0 16px; }

  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin: 14px 0 5px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=date], input[type=month], input[type=number], input[type=tel], input[type=email], input[type=password], textarea, select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--flour); color: var(--ink); font-size: 14px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 54px; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--wheat); outline-offset: 1px; }

  .client-pick { position: relative; }
  .client-results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--flour); border: 1px solid var(--border); border-radius: 7px; box-shadow: var(--shadow); z-index: 5; max-height: 190px; overflow-y: auto; }
  .client-results div { padding: 8px 11px; font-size: 13.5px; cursor: pointer; }
  .client-results div:hover { background: var(--crumb-2); }
  .client-chip { display: flex; align-items: center; justify-content: space-between; background: var(--sage-soft); border: 1px solid var(--sage); border-radius: 7px; padding: 8px 11px; font-size: 13.5px; margin-top: 6px; }
  .client-chip button { background: none; border: none; color: var(--sage); cursor: pointer; font-size: 12px; font-weight: 700; padding: 0; }

  .items-list { margin-top: 6px; display: flex; flex-direction: column; gap: 8px; }
  .item-row { display: grid; grid-template-columns: 1fr 64px 26px; gap: 6px; align-items: center; }
  .item-row input { padding: 7px 9px; font-size: 13.5px; }
  .item-row .del { background: none; border: none; color: var(--jam); font-size: 16px; cursor: pointer; padding: 0; }
  .quick-add { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .quick-add button {
    background: var(--flour); border: 1px solid var(--border); color: var(--ink); font-size: 12.5px;
    padding: 5px 10px; border-radius: 20px; cursor: pointer; font-family: inherit;
  }
  .quick-add button:hover { border-color: var(--wheat); color: var(--wheat-dark); }
  .quick-add button.other { border-style: dashed; }

  .btn-main { width: 100%; margin-top: 16px; background: var(--wheat); color: #2B1D08; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14.5px; cursor: pointer; font-family: inherit; }
  .btn-main:hover { background: var(--wheat-dark); color: #fff; }
  .btn-main.small { width: auto; margin: 0; padding: 9px 16px; }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--ink-soft); padding: 8px 12px; border-radius: 7px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-ghost:hover { border-color: var(--ink-soft); color: var(--ink); }

  .list-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; justify-content: space-between; }
  .list-toolbar input[type=text] { max-width: 220px; }
  .list-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; }

  .order-card { background: var(--flour); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; }
  .order-card .client-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; }
  .order-card .deliv { font-size: 11.5px; font-weight: 700; color: var(--wheat-dark); text-transform: capitalize; }
  .order-card .items-summary { grid-column: 1 / 2; font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .order-card .notes { grid-column: 1 / 2; font-size: 12.5px; color: var(--ink-soft); font-style: italic; }
  .order-card .who { grid-column: 1 / 2; font-size: 11px; color: var(--ink-soft); opacity: 0.75; }
  .order-card .side { grid-row: 1 / 5; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; justify-content: space-between; }
  .card-actions { display: flex; gap: 8px; }
  .card-actions button { background: none; border: none; cursor: pointer; color: var(--ink-soft); font-size: 14px; padding: 2px; }
  .card-actions button:hover { color: var(--jam); }

  .empty { text-align: center; padding: 50px 20px; color: var(--ink-soft); }
  .empty .mark { font-size: 34px; display: block; margin-bottom: 10px; }

  .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .client-card { background: var(--flour); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; cursor: pointer; }
  .client-card:hover { border-color: var(--wheat); }
  .client-card .name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; }
  .client-card .meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }
  .client-card .count { display: inline-block; margin-top: 8px; font-size: 11.5px; font-weight: 700; background: var(--crumb-2); padding: 3px 9px; border-radius: 20px; color: var(--ink-soft); }

  .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .top-actions h2 { margin: 0; font-family: 'Fraunces', serif; font-size: 19px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(43,33,26,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal { background: var(--flour); border-radius: var(--radius); padding: 22px; max-width: 440px; width: 100%; max-height: 86vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
  .modal h3 { font-family: 'Fraunces', serif; margin: 0 0 14px; font-size: 18px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .modal-actions .btn-main { margin-top: 0; width: auto; flex: 1; }

  .product-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .product-tag { display: flex; align-items: center; gap: 6px; background: var(--crumb-2); border-radius: 20px; padding: 4px 6px 4px 11px; font-size: 12.5px; }
  .product-tag button { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 12px; padding: 0; }
  .add-product-row { display: flex; gap: 6px; margin-top: 8px; }
  .add-product-row input { flex: 1; }
  .add-product-row button { flex-shrink: 0; }

  .fab { display: none; position: fixed; bottom: 22px; right: 22px; width: 54px; height: 54px; border-radius: 50%; background: var(--wheat); color: #2B1D08; border: none; font-size: 26px; box-shadow: 0 6px 18px rgba(0,0,0,0.25); cursor: pointer; z-index: 20; }
  @media (max-width: 860px) {
    .fab { display: block; }
    .layout .panel:first-child { display: none; }
    .layout .panel:first-child.mobile-open { display: block; position: fixed; inset: 0; z-index: 40; border-radius: 0; overflow-y: auto; max-height: 100vh; top: 62px; }
  }
  .mobile-close { display: none; }
  @media (max-width: 860px) { .mobile-close { display: block; margin-bottom: 10px; background: none; border: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600; } }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }

  .login-screen { min-height: calc(100vh - 0px); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { background: var(--crumb); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px 26px; max-width: 360px; width: 100%; box-shadow: var(--shadow); text-align: center; }
  .login-box .mark { font-size: 38px; }
  .login-box h1 { font-family: 'Fraunces', serif; font-size: 21px; margin: 6px 0 20px; }
  .employee-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .employee-btn { background: var(--flour); border: 1px solid var(--border); border-radius: 9px; padding: 14px 8px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13.5px; color: var(--ink); }
  .employee-btn:hover { border-color: var(--wheat); }
  .employee-btn .avatar2 { width: 38px; height: 38px; border-radius: 50%; background: var(--wheat); color: #2B1D08; display: flex; align-items: center; justify-content: center; font-weight: 700; margin: 0 auto 6px; }

  .cal-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .cal-nav { display: flex; align-items: center; gap: 10px; }
  .cal-nav button { background: var(--flour); border: 1px solid var(--border); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-family: inherit; font-weight: 700; }
  .cal-range { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; text-transform: capitalize; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  @media (max-width: 900px) { .cal-grid { grid-template-columns: 1fr; } }
  .cal-day { background: var(--flour); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; min-height: 140px; }
  .cal-day.today { background: #FFD9B8; border: 3px solid #E8590C; box-shadow: 0 4px 14px rgba(232,89,12,.45); }
  .cal-day.today .cal-day-head .dname { background: #E8590C; color: #fff; padding: 2px 10px; border-radius: 12px; }
  .cal-day.today .cal-day-head .dnum { color: #B13D00; font-weight: 800; font-size: 14px; }
  .cal-day.today .cal-order { background: #fff; }
  .today-tag { display:block; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#E8590C; margin:-4px 0 6px; }
  .cal-flags { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:6px; padding-top:5px; border-top:1px dashed var(--border); }
  .cal-flag { white-space:nowrap; display:flex; align-items:center; gap:4px; font-size:11.5px; cursor:pointer; user-select:none; color:var(--ink-soft); }
  .cal-flag input { width:16px; height:16px; margin:0; cursor:pointer; accent-color:#4C7A4A; }
  .cal-flag.on { color:#2f6b2c; font-weight:700; }
  .cal-order.is-ready { border-left: 4px solid #4C7A4A; }
  .cal-order.is-invoiced { background: #EEF6EC; }
  .cal-day-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .cal-day-head .dname { font-family: 'Fraunces', serif; font-weight: 600; font-size: 13.5px; text-transform: capitalize; }
  .cal-day-head .dnum { font-size: 12px; color: var(--ink-soft); }
  .cal-order { background: var(--crumb); border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; margin-bottom: 6px; font-size: 12px; cursor: pointer; }
  .cal-order .cn { font-weight: 700; }
  .cal-order .ci { color: var(--ink-soft); line-height: 1.4; }
  .cal-empty { font-size: 11.5px; color: var(--ink-soft); opacity: 0.6; padding: 6px 0; }
  .unscheduled-box { margin-top: 18px; }

  .recap-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

  #printArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { display: block; position: absolute; top: 0; left: 0; width: 100%; padding: 20px; color: #000; background: #fff; }
    #printArea h1 { font-family: 'Fraunces', serif; font-size: 20px; margin: 0 0 4px; }
    #printArea p { margin: 0 0 16px; color: #444; }
    #printArea .p-order { padding: 10px 0; border-bottom: 1px solid #ccc; break-inside: avoid; }
    #printArea .p-client { font-weight: 700; font-size: 14px; }
    #printArea .p-meta { font-size: 12px; color: #444; }
    #printArea .p-items { font-size: 13px; margin-top: 2px; }
    #printArea .p-notes { font-size: 12px; font-style: italic; color: #444; margin-top: 2px; }
  }
  .recap-client { background: var(--flour); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
  .recap-client h3 { font-family: 'Fraunces', serif; font-size: 16px; margin: 0 0 4px; }
  .recap-client .n { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
  .recap-table { width: 100%; border-collapse: collapse; }
  .recap-table td { padding: 6px 4px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .recap-table td.num { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .recap-table tr:last-child td { border-bottom: none; }

  .import-box { background: var(--flour); border: 1px dashed var(--wheat); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(10px);
    background: var(--crust); color: var(--flour); padding: 11px 18px; border-radius: 8px;
    font-size: 13.5px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 80; max-width: 90vw;
    text-align: center; opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .confirm-modal .modal { max-width: 340px; text-align: center; }
  .confirm-modal .modal-actions { justify-content: center; }
  .confirm-modal .modal-actions button { flex: 1; }
  .confirm-modal .danger { background: var(--jam); color: #fff; }
</style>
</head>
<body>

<header class="top" id="topHeader" style="display:none;">
  <div class="brand"><span class="mark">🥖</span><h1>Carnet de commandes</h1></div>
  <nav class="tabs">
    <button class="active" data-tab="commandes">Accueil</button>
    <button data-tab="calendrier">Calendrier</button>
    <button data-tab="recap">Récapitulatif</button>
    <button data-tab="clients">Clients</button>
  </nav>
  <div class="header-right">
    <span class="sync-dot" id="syncDot"><i></i><span id="syncLabel">Synchronisation…</span></span>
    <button class="icon-btn" id="settingsBtn" title="Salariés">⚙</button>
    <div class="whoami" id="whoami"></div>
  </div>
</header>

<div id="loginRoot"><div class="login-screen"><div class="login-box"><div class="mark">🥖</div><h1>Chargement…</h1></div></div></div>

<main id="mainRoot" style="display:none;">
  <div id="view-commandes"></div>
  <div id="view-calendrier" style="display:none"></div>
  <div id="view-recap" style="display:none"></div>
  <div id="view-clients" style="display:none"></div>
</main>

<button class="fab" id="fab" title="Nouvelle commande">+</button>
<div id="modalRoot"></div>

  // ---------- harmonisation des produits ----------
  let prodSettings = { names: [], aliases: {} };   // doc Firestore settings/products
  let catCache = null;
  const SYN_WORDS = { choc:'chocolat', pp:'petit pain', baguerre:'baguette', baguete:'baguette', bagette:'baguette', croisant:'croissant', tresse:'tresse', treesee:'tresse' };
  const SEED_ALIASES = { 'tradition':'Baguette tradition', 'croque':'Pain à croques', 'pain croque':'Pain à croques' };
  const STOP_WORDS = new Set(['de','d','du','des','la','le','les','l','au','aux','a','et']);
  function normKey(s){
    let t = String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe');
    t = t.replace(/['’`´]/g,' ').replace(/(\d),(\d)/g,'$1.$2').replace(/[^a-z0-9.\s]/g,' ').replace(/(\d)\s+(kg|g)\b/g,'$1$2');
    const out = [];
    t.split(/\s+/).filter(Boolean).forEach(w => {
      if(STOP_WORDS.has(w)) return;
      w = SYN_WORDS[w] || w;
      w.split(' ').forEach(x => {
        if(x.length > 3 && /[^s]s$/.test(x)) x = x.slice(0,-1);
        out.push(x);
      });
    });
    return out.join(' ');
  }
  function capFirst(s){ s = String(s||'').trim().replace(/\s+/g,' '); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function allAliases(){ return Object.assign({}, SEED_ALIASES, prodSettings.aliases || {}); }
  function buildCatalog(){
    if(catCache) return catCache;
    const aliases = allAliases(), map = {}, spell = {};
    (prodSettings.names || []).forEach(n => { const k = normKey(n); if(k && !map[k]) map[k] = capFirst(n); });
    const seen = (name) => {
      let n = capFirst(name); if(!n) return;
      let k = normKey(n);
      if(aliases[k]){ n = aliases[k]; k = normKey(n); }
      if(!k) return;
      (spell[k] = spell[k] || {})[n] = ((spell[k][n]) || 0) + 1;
    };
    clients.forEach(c => (c.products || []).forEach(seen));
    Object.keys(aliases).forEach(k => { const n = aliases[k], kk = normKey(n); if(kk && !map[kk] && !spell[kk]) (spell[kk] = spell[kk] || {})[capFirst(n)] = 0; });
    Object.keys(spell).forEach(k => {
      if(map[k]) return;
      const opts = Object.keys(spell[k]).sort((a,b) => spell[k][b] - spell[k][a]);
      map[k] = opts[0];
    });
    catCache = map;
    return map;
  }
  function canonProduct(name){
    const raw = capFirst(name);
    let k = normKey(raw);
    if(!k) return { key:'', name: raw };
    const al = allAliases()[k];
    if(al){ raw && (k = normKey(al)); }
    const cat = buildCatalog();
    return { key:k, name: cat[k] || capFirst(al || raw) };
  }
  function catalogList(){ const m = buildCatalog(); return Object.keys(m).map(k => ({ key:k, name:m[k] })).sort((a,b) => a.name.localeCompare(b.name,'fr')); }
  function uniqueProducts(list){
    const seen = new Set(), out = [];
    (list || []).forEach(p => { const c = canonProduct(p); if(c.key && !seen.has(c.key)){ seen.add(c.key); out.push(c.name); } });
    return out;
  }

  }

  // ---------- db wiring ----------
  async function initDb(){
    try {
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    } catch(e) { db = null; }
    if(!db){
      setSyncStatus(false, "Mode local (pas de synchro)");
      employees = [{id:'local', name:'Moi', code:''}];
      currentEmployee = employees[0];
      showApp();
      return;
    }
    setSyncStatus(true, "Synchronisé");
    let gotEmployees = false;
    db.collection('employees').orderBy('name','asc').onSnapshot(snap => {
      employees = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if(!gotEmployees){
        gotEmployees = true;
        const recalled = recallEmployeeId();
        if(recalled){ const e = employees.find(x=>x.id===recalled); if(e) currentEmployee = e; }
      } else if(currentEmployee){
        const fresh = employees.find(x=>x.id===currentEmployee.id);
        if(fresh) currentEmployee = fresh;
      }
      renderLoginOrApp();
      renderSettingsIfOpen();
    }, err => { setSyncStatus(false, 'Connexion perdue'); });

    db.collection('clients').orderBy('name','asc').onSnapshot(snap => {
      clients = snap.docs.map(d => ({ id: d.id, products: [], ...d.data() }));
      catCache = null;
      renderCurrentView();
    }, err => { setSyncStatus(false, 'Connexion perdue'); });

    db.collection('settings').doc('products').onSnapshot(doc => {
      const d = doc.exists ? doc.data() : {};
      prodSettings = { names: d.names || [], aliases: d.aliases || {} };
      catCache = null;
      renderCurrentView();
    }, err => {});

    db.collection('orders').onSnapshot(snap => {
      orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderCurrentView();
    }, err => { setSyncStatus(false, 'Connexion perdue'); });
  }

  function orderDiffHtml(a, b){
    const rows = [];
    const ia = orderItemsSummary(a), ib = orderItemsSummary(b);
    if(ia !== ib) rows.push(['Produits', ia, ib]);
    if((a.deliveryDate||'') !== (b.deliveryDate||'')) rows.push(['Date', fmtDate(a.deliveryDate), fmtDate(b.deliveryDate)]);
    if((a.notes||'') !== (b.notes||'')) rows.push(['Note', a.notes || '(aucune)', b.notes || '(aucune)']);
    if(!rows.length) return '<div class="hint">Aucun changement par rapport à la commande actuelle.</div>';
    return rows.map(([k,x,y]) => `<div style="margin-top:8px;font-size:13px;line-height:1.45;"><strong>${k}</strong><br><span style="color:var(--ink-soft);">avant : ${escapeHtml(x)}</span><br>après : <strong>${escapeHtml(y)}</strong></div>`).join('');

  function orderSnapshot(o){

  async function saveClient(c){
    const isNew = !c.id;
    if(db){ if(!c.id) c.id = uid(); await db.collection('clients').doc(c.id).set(c); }
    else { if(!c.id){ c.id = uid(); clients.push(c); } else { const i=clients.findIndex(x=>x.id===c.id); clients[i]=c; } renderCurrentView(); }
    logAction(isNew ? 'Client créé' : 'Client modifié', c.name);
    return c;
  }
  async function mergeClients(from, to){
    const moved = orders.filter(o => o.clientId === from.id).map(o => Object.assign({}, o, { clientId: to.id, clientName: to.name }));
    const merged = Object.assign({}, to, { products: uniqueProducts((to.products||[]).concat(from.products||[])) });
    if(db){
      const batch = db.batch();
      moved.forEach(o => batch.set(db.collection('orders').doc(o.id), JSON.parse(JSON.stringify(o))));
      batch.set(db.collection('clients').doc(to.id), JSON.parse(JSON.stringify(merged)));
      batch.delete(db.collection('clients').doc(from.id));
      await batch.commit();
    } else {
      moved.forEach(o => { const i = orders.findIndex(x => x.id === o.id); orders[i] = o; });
      const i = clients.findIndex(x => x.id === to.id); clients[i] = merged;
      clients = clients.filter(x => x.id !== from.id); renderCurrentView();
    }
    logAction('Clients fusionnés', `${from.name} → ${to.name} (${moved.length} commande${moved.length>1?'s':''})`);
  }
  async function deleteClientDb(id){
    const c = clients.find(x => x.id === id);

    logAction('Client supprimé', c ? c.name : id);

  async function saveOrder(o, prev, label){
    if(db){ if(!o.id) o.id = uid(); await db.collection('orders').doc(o.id).set(o); }
    else { if(!o.id){ o.id = uid(); orders.push(o); } else { const i=orders.findIndex(x=>x.id===o.id); if(i>=0) orders[i]=o; else orders.push(o); } renderCurrentView(); }
    if(prev){
      logAction(label || 'Commande modifiée', '', { before: orderFullSummary(prev), after: orderFullSummary(o), snapshot: orderSnapshot(prev) });
    } else {
      logAction(label || 'Commande créée', orderFullSummary(o));
    }
    return o;
  }

  function renderHistory(){
    const modalRoot = document.getElementById('modalRoot');
    modalRoot.innerHTML = `
      <div class="modal-bg" id="histBg"><div class="modal" style="max-width:480px;">
        <h3>Historique des actions</h3>
        <div class="hint" style="margin-bottom:10px;">Les 300 dernières actions, les plus récentes en premier. Une commande modifiée ou supprimée peut être restaurée.</div>
        <select id="histFilter" style="margin-bottom:10px;"><option value="">Tous les salariés</option></select>
        <div id="histList"><div class="hint">Chargement…</div></div>
        <div class="modal-actions"><button class="btn-ghost" id="histClose" style="width:100%;">Fermer</button></div>
      </div></div>`;
    document.getElementById('histClose').addEventListener('click', () => { modalRoot.innerHTML=''; });
    document.getElementById('histBg').addEventListener('click', e => { if(e.target.id==='histBg') modalRoot.innerHTML=''; });
    if(!db) return;
    let allRows = [];
    function paint(){
      const list = document.getElementById('histList');
      if(!list) return;
      const filter = document.getElementById('histFilter').value;
      const rows = filter ? allRows.filter(r => r.employee === filter) : allRows;
      if(rows.length === 0){ list.innerHTML = '<div class="hint">Aucune action pour ce filtre.</div>'; return; }
      list.innerHTML = `<div style="max-height:50vh;overflow-y:auto;">${rows.map((r,i) => {
        const d = new Date(r.ts);
        const when = d.toLocaleDateString('fr-FR', {day:'numeric',month:'short'}) + ' à ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
        const detail = r.before
          ? `<div class="hint" style="margin-top:3px;">Avant : ${escapeHtml(r.before)}</div><div class="hint">Après : ${escapeHtml(r.after||'')}</div>`
          : (r.details ? `<div class="hint" style="margin-top:3px;">${escapeHtml(r.details)}</div>` : '');
        const restore = r.snapshot ? `<button class="btn-ghost histRestore" data-i="${i}" style="margin-top:5px;font-size:12px;padding:4px 10px;">↩ Restaurer l'état d'avant</button>` : '';
        return `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <span style="color:var(--ink-soft);">${when}</span> — <strong>${escapeHtml(r.employee||'?')}</strong> : ${escapeHtml(r.action||'')}${detail}${restore}
        </div>`;
      }).join('')}</div>`;
      list.querySelectorAll('.histRestore').forEach(b => b.addEventListener('click', () => restoreFromLog(rows[Number(b.dataset.i)])));
    }
    db.collection('activityLog').orderBy('ts','desc').limit(300).get().then(snap => {
      const list = document.getElementById('histList');
      if(!list) return; // modal fermée entre-temps
      allRows = snap.docs.map(d => d.data());
      if(allRows.length === 0){ list.innerHTML = '<div class="hint">Aucune action enregistrée pour l\'instant.</div>'; return; }
      const names = [...new Set(allRows.map(r => r.employee).filter(Boolean))].sort();
      const sel = document.getElementById('histFilter');
      if(sel) names.forEach(n => sel.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`));
      if(sel) sel.addEventListener('change', paint);
      paint();
    }).catch(() => {
      const list = document.getElementById('histList');
      if(list) list.innerHTML = '<div class="hint">Impossible de charger l\'historique.</div>';
    });
  }
  function restoreFromLog(r){
    const s = r && r.snapshot; if(!s) return;
    const current = orders.find(o => o.id === s.id) || null;
    const msg = current
      ? `Remettre cette commande dans l'état d'avant ? Elle sera remplacée par : ${orderFullSummary(s)}`
      : `Recréer cette commande : ${orderFullSummary(s)} ?`;
    askConfirm(msg, async () => {
      const o = Object.assign({}, s, { updatedBy: currentEmployee ? currentEmployee.name : '', updatedAt: Date.now() });
      await saveOrder(o, current, 'Commande restaurée');
      toast('Commande restaurée.');
      setTimeout(renderHistory, 700);
    }, 'Restaurer');
  }
  function exportFullBackup(){
    const data = {
      exportedAt: new Date().toISOString(),
      clients: clients,
      orders: orders,
      employees: employees.map(e => ({ id: e.id, name: e.name })), // codes exclus de la sauvegarde
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `carnet-sauvegarde-${toISO(new Date())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Sauvegarde téléchargée.');
  }

  function rangeDates(from, to, weekdays){
    const out = []; if(!from || !to) return out;
    const d = new Date(from + 'T00:00:00'), end = new Date(to + 'T00:00:00');
    for(let i = 0; d <= end && i < 400; i++, d.setDate(d.getDate() + 1)){
      if(weekdays[(d.getDay() + 6) % 7]) out.push(toISO(d));
    }
    return out;
  }

  function clientKey(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }
  function lev(a,b){
    const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
    let prev=Array.from({length:n+1},(_,j)=>j);
    for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
    return prev[n];
  }
  // clients proches d'un nom tapé (faute de frappe, accents…)
  function similarClients(q){
    const qk = clientKey(q); if(qk.length < 2) return [];
    return clients.map(c => {
      const ck = clientKey(c.name);
      if(ck === qk) return { c, d:0 };
      if(ck.includes(qk)) return { c, d:0.5 };
      const toks = String(q).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(t => t.length >= 2);
      const cn = String(c.name).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if(toks.length > 1 && toks.every(t => cn.includes(t))) return { c, d:0.6 };
      const tol = qk.length <= 4 ? 1 : Math.floor(qk.length/4)+1;
      const dFull = lev(qk, ck);
      const dPre = qk.length >= 3 ? lev(qk, ck.slice(0, qk.length)) : 99;
      const d = Math.min(dFull, dPre + 0.25);
      return d <= tol ? { c, d } : null;
    }).filter(Boolean).sort((a,b) => a.d - b.d).map(x => x.c);
  }
  function renderClientResults(){

    if(q && !clients.some(c => clientKey(c.name) === clientKey(q))){

    box.innerHTML = html || '<div class="hint" style="padding:8px 11px;">Aucun client</div>';
    box.querySelectorAll('div[data-id]').forEach(el => el.addEventListener('click', () => {
      const c = clients.find(x => x.id === el.dataset.id);
      draft.clientId = c.id; draft.clientName = c.name; clientQuery=''; refreshForm();
    }));
    const newEl = box.querySelector('div[data-new]');
    if(newEl) newEl.addEventListener('click', async () => {
      const name = clientQuery.trim();
      const sims = similarClients(name).slice(0,3);
      const useBtns = sims.map(c => ({ label:`Choisir « ${c.name} » (client existant)`, cls:'btn-main', onClick: () => { draft.clientId = c.id; draft.clientName = c.name; clientQuery=''; refreshForm(); } }));
      askChoice(
        `<p style="margin:0 0 6px;"><strong>Créer un nouveau client « ${escapeHtml(name)} » ?</strong></p>
         <div class="hint" style="margin:0;">${sims.length ? 'Attention : un client qui ressemble existe déjà. Est-ce une faute de frappe ?' : 'Ce client n\'existe pas encore dans la liste. Vérifie l\'orthographe avant de le créer.'}</div>`,
        useBtns.concat([
          { label:`Oui, créer « ${name} »`, cls: sims.length ? 'btn-ghost' : 'btn-main', onClick: async () => {

  function resetDraft(){ editingOrderId = null; draft = { clientId:null, clientName:'', items:[], deliveryDate:'', notes:'' }; clientQuery=''; draftDates = []; multiDayOpen = false; mdFrom = ''; mdTo = ''; }
  function backupDraft(){ return { editingOrderId, draft: JSON.parse(JSON.stringify(draft)), draftDates: draftDates.slice(), multiDayOpen }; }
  function restoreDraft(b){ editingOrderId = b.editingOrderId; draft = b.draft; draftDates = b.draftDates; multiDayOpen = b.multiDayOpen; mobileFormOpen = true; renderCommandes(); }
  async function submitOrder(){
    if(Date.now() - lastCommitAt < 1500) return;   // anti double-clic
    if(!draft.clientId){ toast('Choisis ou crée un client pour cette commande.'); return; }
    const rawItems = draft.items.map(it => ({ name:(it.name||'').trim(), qty:Number(it.qty)||0 })).filter(it => it.name);
    if(rawItems.length === 0){ toast('Ajoute au moins un article.'); return; }
    const items = [], itemIdx = {};
    rawItems.forEach(it => {
      const c = canonProduct(it.name);
      if(c.key in itemIdx){ items[itemIdx[c.key]].qty += it.qty; }
      else { itemIdx[c.key] = items.length; items.push({ name:c.name, qty:it.qty }); }
    });
    learnProducts(items.map(i => i.name));
    const prev = editingOrderId ? orders.find(o=>o.id===editingOrderId) : null;
    if(prev && draft.clientId !== prev.clientId){ toast("Le client d'une commande existante ne peut pas être changé."); return; }

    // --- commande sur plusieurs jours (droit réservé) ---
    if(canMultiDay() && multiDayOpen && !editingOrderId){
      if(draftDates.length === 0){ toast('Ajoute au moins un jour.'); return; }
      const dates = draftDates.slice(), n = dates.length;
      askChoice(
        `<p style="margin:0 0 10px;"><strong>Créer ${n} commande${n>1?'s':''}</strong> pour ${escapeHtml(draft.clientName)} ?</p>
         <div class="hint">Jours : ${dates.map(d => escapeHtml(shortDay(d))).join(', ')}</div>
         <div class="hint" style="margin-top:4px;">Produits : ${escapeHtml(items.map(it => `${it.qty}×${it.name}`).join(', '))}</div>
         ${draft.notes.trim() ? `<div class="hint" style="margin-top:4px;">Note : ${escapeHtml(draft.notes.trim())}</div>` : ''}`,
        [
          { label: n>1 ? `Créer les ${n} commandes` : 'Créer la commande', cls:'btn-main', onClick: () => commitMultiDay(items, dates) },
          { label:'Revenir au formulaire' }
        ]
      );
      return;
    }

    const order = {
      id: editingOrderId,
      clientId: draft.clientId, clientName: draft.clientName, items,
      deliveryDate: draft.deliveryDate, notes: draft.notes.trim(),
      createdAt: prev ? prev.createdAt : Date.now(),
      createdBy: prev ? prev.createdBy : (currentEmployee ? currentEmployee.name : ''),
      updatedBy: currentEmployee ? currentEmployee.name : '',
      updatedAt: Date.now(),
    };
    if(prev){ ['ready','readyBy','readyAt','invoiced','invoicedBy','invoicedAt'].forEach(k => { if(prev[k] !== undefined) order[k] = prev[k]; }); }
    if(!editingOrderId){ commitOrder(order, null); return; }
    if(!prev){ order.id = null; order.createdAt = Date.now(); order.createdBy = currentEmployee ? currentEmployee.name : ''; commitOrder(order, null); return; }
    askChoice(
      `<p style="margin:0 0 4px;"><strong>${escapeHtml(prev.clientName)}</strong> : cette commande existe déjà.</p>
       <div class="hint" style="margin:0;">Voici ce qui change :</div>${orderDiffHtml(prev, order)}
       <p style="margin:12px 0 0;">Que veux-tu faire ?</p>`,
      [
        { label:"Remplacer l'ancienne commande", cls:'btn-main', onClick: () => commitOrder(order, prev) },
        { label:"Créer une nouvelle commande (garder l'ancienne)", cls:'btn-ghost', onClick: () => commitOrder(Object.assign({}, order, { id:null, createdAt:Date.now(), createdBy: currentEmployee ? currentEmployee.name : '' }), null) },
        { label:'Revenir au formulaire' }
      ]
    );
  }
  // Le formulaire est vidé tout de suite (avant la fin de l'écriture en base) :

  async function commitOrder(order, prev){
    lastCommitAt = Date.now();
    const backup = backupDraft();
    resetDraft(); mobileFormOpen = false; renderCommandes();
    window.scrollTo({ top:0, behavior:'smooth' });
    toast('Enregistrement…');
    try {
      await saveOrder(order, prev);
      toast('Commande enregistrée ✓');
    } catch(e) {
      restoreDraft(backup);
      toast("L'enregistrement a échoué : vérifie la connexion et réessaie.");
    }
  }
  async function commitMultiDay(items, dates){

    const now = Date.now(), who = currentEmployee ? currentEmployee.name : '';

      id: null, clientId: draft.clientId, clientName: draft.clientName,

      deliveryDate: d, notes: draft.notes.trim(),
      createdAt: now + i, createdBy: who, updatedBy: who, updatedAt: now,
    }));

        </div>
        <div class="n">${fmtDate(prodDate)} — par client</div>
        ${prodOrders.length === 0 ? `<div class="hint" style="margin-top:8px;">Aucune livraison ce jour-là.</div>` : prodOrders.slice().sort((a,b)=>(a.clientName||'').localeCompare(b.clientName||'')).map(o => {
          const cl = clients.find(c => c.id === o.clientId);
          return `<div style="padding:8px 0;border-bottom:1px solid var(--border);">
            <strong>${escapeHtml(o.clientName)}</strong>${cl && (cl.phone||cl.address) ? ` <span class="hint" style="display:inline;">— ${escapeHtml([cl.phone,cl.address].filter(Boolean).join(' · '))}</span>` : ''}
            <div class="hint" style="margin-top:2px;">${(o.items||[]).map(it=>`${it.qty}×${escapeHtml(canonProduct(it.name).name)}`).join(', ')}</div>
            ${o.notes ? `<div class="hint" style="font-style:italic;">${escapeHtml(o.notes)}</div>` : ''}
          </div>`;
        }).join('')}
      </div>

      ${unscheduled.length ? `
        <div class="unscheduled-box">
          <p class="list-title" style="margin-bottom:10px;">Sans date de livraison (${unscheduled.length})</p>
          ${unscheduled.map(o => orderCardHtml(o)).join('')}
        </div>
      ` : ''}
    `;
    document.getElementById('printDeliveries').addEventListener('click', () => printDeliveries(prodDate, prodOrders));
    document.getElementById('prevWeek').addEventListener('click', () => { calWeekStart.setDate(calWeekStart.getDate()-7); renderCalendrier(); });
    document.getElementById('nextWeek').addEventListener('click', () => { calWeekStart.setDate(calWeekStart.getDate()+7); renderCalendrier(); });
    document.getElementById('thisWeek').addEventListener('click', () => { calWeekStart = startOfWeek(new Date()); renderCalendrier(); });
    document.getElementById('prodDateInput').addEventListener('input', e => { prodDate = e.target.value; renderCalendrier(); });
    root.querySelectorAll('.cal-day-head').forEach(el => el.addEventListener('click', () => { prodDate = el.dataset.date; renderCalendrier(); document.querySelector('.recap-client').scrollIntoView({behavior:'smooth', block:'nearest'}); }));
    root.querySelectorAll('.cal-order').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); if(e.target.closest('.cal-flags')) return; openOrderDetail(el.dataset.id); }));
    root.querySelectorAll('.flag-cb').forEach(cb => cb.addEventListener('change', e => { e.stopPropagation(); toggleOrderFlag(cb.dataset.id, cb.dataset.flag); }));
    root.querySelectorAll('.cal-del').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      askConfirm('Supprimer cette commande ?', () => deleteOrderDb(b.dataset.id));
    }));
    root.querySelectorAll('.act-edit').forEach(b => b.addEventListener('click', () => openOrderForEdit(b.dataset.id)));
    root.querySelectorAll('.act-del').forEach(b => b.addEventListener('click', () => { askConfirm('Supprimer cette commande ?', () => deleteOrderDb(b.dataset.id)); }));
  }

  function printDeliveries(date, dayOrders){
    let box = document.getElementById('printArea');
    if(!box){ box = document.createElement('div'); box.id = 'printArea'; document.body.appendChild(box); }
    const sorted = dayOrders.slice().sort((a,b)=>(a.clientName||'').localeCompare(b.clientName||''));
    box.innerHTML = `
      <h1>Livraisons — ${fmtDate(date)}</h1>
      <p>${sorted.length} commande${sorted.length>1?'s':''}</p>
      ${sorted.map(o => {
        const cl = clients.find(c => c.id === o.clientId);
        return `<div class="p-order">
          <div class="p-client">${escapeHtml(o.clientName)}</div>
          ${cl && (cl.phone||cl.address) ? `<div class="p-meta">${escapeHtml([cl.phone,cl.address].filter(Boolean).join(' · '))}</div>` : ''}
          <div class="p-items">${(o.items||[]).map(it=>`${it.qty} × ${escapeHtml(canonProduct(it.name).name)}`).join(', ')}</div>
          ${o.notes ? `<div class="p-notes">${escapeHtml(o.notes)}</div>` : ''}
        </div>`;
      }).join('')}
    `;
    window.print();
  }

  // ---------- RECAP TAB ----------
  function renderRecap(){
    const root = document.getElementById('view-recap');
    const [y,m] = recapMonth.split('-').map(Number);
    const monthLabel = new Date(y, m-1, 1).toLocaleDateString('fr-FR', { month:'long', year:'numeric' });
    const inMonth = orders.filter(o => {
      if(!o.deliveryDate) return false;
      const [oy,om] = o.deliveryDate.split('-').map(Number);
      return oy===y && om===m;
    });
    const byClient = {};
    inMonth.forEach(o => {
      const k = o.clientId || o.clientName;
      if(!byClient[k]) byClient[k] = { name:o.clientName, count:0, products:{} };
      byClient[k].count += 1;
      (o.items||[]).forEach(it => addTotal(byClient[k].products, it.name, it.qty));
    });
    const clientRows = Object.values(byClient).sort((a,b)=>a.name.localeCompare(b.name));

    root.innerHTML = `
      <div class="recap-header">
        <div class="cal-nav"><button id="prevMonth">‹</button><span class="cal-range">${monthLabel}</span><button id="nextMonth">›</button></div>
        <div style="display:flex; gap:8px;">
          <button class="btn-ghost" id="thisMonth">Ce mois-ci</button>
          <button class="btn-main small" id="exportCsv">Exporter en CSV</button>
        </div>
      </div>
      <div class="hint" style="margin-bottom:14px;">Basé sur les dates de livraison de ${monthLabel} — ${inMonth.length} commande${inMonth.length>1?'s':''}.</div>
      ${clientRows.length === 0 ? `<div class="empty"><span class="mark">🧾</span>Aucune commande ce mois-ci.</div>` : clientRows.map(c => `
        <div class="recap-client">
          <h3>${escapeHtml(c.name)}</h3>
          <div class="n">${c.count} commande${c.count>1?'s':''}</div>
          <table class="recap-table">
            ${Object.values(c.products).sort((a,b)=>b.qty-a.qty).map(p => `<tr><td>${escapeHtml(p.name)}</td><td class="num">${p.qty}</td></tr>`).join('')}
          </table>
        </div>
      `).join('')}
    `;
    document.getElementById('prevMonth').addEventListener('click', () => { shiftMonth(-1); renderRecap(); });
    document.getElementById('nextMonth').addEventListener('click', () => { shiftMonth(1); renderRecap(); });
    document.getElementById('thisMonth').addEventListener('click', () => { recapMonth = currentMonthStr(); renderRecap(); });
    document.getElementById('exportCsv').addEventListener('click', () => exportRecapCsv(clientRows, monthLabel));
  }
  function shiftMonth(delta){
    const [y,m] = recapMonth.split('-').map(Number);
    const d = new Date(y, m-1+delta, 1);
    recapMonth = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  }
  function exportRecapCsv(clientRows){
    let csv = 'Client;Produit;Quantite totale\n';
    clientRows.forEach(c => {
      Object.values(c.products).sort((a,b)=>b.qty-a.qty).forEach(p => {
        csv += `${c.name.replace(/;/g,',')};${p.name.replace(/;/g,',')};${p.qty}\n`;
      });
    });
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `recapitulatif-${recapMonth}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- CLIENTS TAB ----------
  let clientSearchQuery = '';
  function renderClients(){
    const root = document.getElementById('view-clients');
    const needsImport = clients.length === 0;
    root.innerHTML = `
      <div class="top-actions">
        <h2>Clients</h2>
        ${canCreateClients() ? `<button class="btn-main small" id="newClientBtn">+ Nouveau client</button>` : ''}
      </div>
      ${IMPORT_CLIENTS.length && canCreateClients() ? `
        <div class="import-box">
          <span>Importer ta liste de ${IMPORT_CLIENTS.length} clients et leurs produits habituels (fichier Excel)</span>
          <button class="btn-ghost" id="importBtn">Importer</button>
        </div>
      ` : ''}
      ${canCreateClients() ? `<div class="import-box"><span>Harmoniser l'écriture des produits (fusionner les doublons, renommer)</span><button class="btn-ghost" id="prodMgrBtn">Produits</button></div>` : ''}
      <input type="text" id="clientListSearch" placeholder="Rechercher un client…" value="${escapeHtml(clientSearchQuery)}" style="max-width:260px;margin-bottom:16px;">
      <div class="client-grid" id="clientGrid"></div>
    `;
    const newClientBtn = document.getElementById('newClientBtn');
    if(newClientBtn) newClientBtn.addEventListener('click', () => openClientModal(null));
    document.getElementById('clientListSearch').addEventListener('input', e => { clientSearchQuery = e.target.value; renderClientGrid(); });
    const pmb = document.getElementById('prodMgrBtn');
    if(pmb) pmb.addEventListener('click', openProductManager);
    const importBtn = document.getElementById('importBtn');
    if(importBtn) importBtn.addEventListener('click', runImport);
    renderClientGrid();
  }
  async function runImport(){
    let created = 0, updated = 0;
    for(const entry of IMPORT_CLIENTS){
      const existing = clients.find(c => c.name.trim().toLowerCase() === entry.name.trim().toLowerCase());
      if(existing){
        const current = existing.products || [];
        const merged = current.slice();
        entry.products.forEach(p => { if(!merged.some(x=>canonProduct(x).key===canonProduct(p).key)) merged.push(p); });
        if(merged.length !== current.length){
          await saveClient({ ...existing, products: merged });
          updated++;
        }
      } else {
        await saveClient({ name: entry.name, phone:'', email:'', address:'', notes:'', products: entry.products.slice() });
        created++;
      }
    }
    toast(`Import terminé : ${created} client(s) créé(s), ${updated} mis à jour.`);
    renderClients();
  }
  function renderClientGrid(){
    const box = document.getElementById('clientGrid');
    const q = clientSearchQuery.trim().toLowerCase();
    const list = clients.filter(c => !q || c.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
    if(list.length === 0){ box.innerHTML = `<div class="empty" style="grid-column:1/-1;"><span class="mark">👥</span>Aucun client enregistré.</div>`; return; }
    box.innerHTML = list.map(c => {
      const n = orders.filter(o => o.clientId === c.id).length;
      const np = (c.products||[]).length;
      return `
        <div class="client-card" data-id="${c.id}">
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="meta">${c.phone ? escapeHtml(c.phone)+'<br>' : ''}${c.email ? escapeHtml(c.email)+'<br>' : ''}${c.address ? escapeHtml(c.address) : ''}</div>
          <span class="count">${n} commande${n>1?'s':''}</span> <span class="count">${np} produit${np>1?'s':''}</span>
        </div>`;
    }).join('');
    box.querySelectorAll('.client-card').forEach(el => el.addEventListener('click', () => openClientModal(el.dataset.id)));
  }
  function openClientModal(id){
    const c = id ? clients.find(x => x.id === id) : { name:'', phone:'', email:'', address:'', notes:'', products:[] };
    const isNew = !id;
    const clientOrders = id ? orders.filter(o => o.clientId === id) : [];
    const modalRoot = document.getElementById('modalRoot');
    modalRoot.innerHTML = `
      <div class="modal-bg" id="modalBg"><div class="modal">
        <h3>${isNew ? 'Nouveau client' : escapeHtml(c.name)}</h3>
        <label>Nom</label>
        <input type="text" id="mName" value="${escapeHtml(c.name)}">
        <div class="field-row">
          <div><label>Téléphone</label><input type="tel" id="mPhone" value="${escapeHtml(c.phone||'')}"></div>
          <div><label>Email</label><input type="email" id="mEmail" value="${escapeHtml(c.email||'')}"></div>
        </div>
        <label>Adresse</label>
        <input type="text" id="mAddress" value="${escapeHtml(c.address||'')}">
        <label>Notes</label>
        <textarea id="mNotes">${escapeHtml(c.notes||'')}</textarea>
        <label>Case « Facturé » dans le calendrier</label>
        <select id="mTracking">
          <option value="auto" ${c.tracking==null?'selected':''}>Automatique (Hermitage, Ponton, Royal, Castel, Casino seulement)</option>
          <option value="yes" ${c.tracking===true?'selected':''}>Oui, pour ce client</option>
          <option value="no" ${c.tracking===false?'selected':''}>Non</option>
        </select>
        <label>Produits habituels</label>
        <div class="product-tags" id="productTags"></div>
        <div class="add-product-row">
          <input type="text" id="newProductName" placeholder="Ajouter un produit…">
          <button class="btn-ghost" id="addProductBtn" type="button">Ajouter</button>
        </div>
        ${!isNew && clientOrders.length ? `
          <label>Historique (${clientOrders.length})</label>
          <div class="hint">${clientOrders.slice(0,5).map(o => `${fmtDate(o.deliveryDate)} — ${(o.items||[]).map(it=>it.qty+'×'+escapeHtml(it.name)).join(', ')}`).join('<br>')}</div>
        ` : ''}
        <div class="modal-actions">
          <button class="btn-main" id="mSave">Enregistrer</button>
          <button class="btn-ghost" id="mCancel">Annuler</button>
          ${!isNew && canCreateClients() ? '<button class="btn-ghost" id="mMerge">Fusionner avec un autre client</button>' : ''}
          ${!isNew ? '<button class="btn-ghost" id="mDelete" style="color:var(--jam);border-color:var(--jam-soft);">Supprimer</button>' : ''}
        </div>
      </div></div>
    `;
    let productList = (c.products||[]).slice();
    function renderTags(){
      document.getElementById('productTags').innerHTML = productList.map((p,i) => `<span class="product-tag">${escapeHtml(p)}<button data-i="${i}">✕</button></span>`).join('') || '<span class="hint">Aucun produit enregistré.</span>';
      document.getElementById('productTags').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { productList.splice(Number(b.dataset.i),1); renderTags(); }));
    }
    renderTags();
    document.getElementById('addProductBtn').addEventListener('click', () => {
      const input = document.getElementById('newProductName');
      const c = canonProduct(input.value);
      if(c.key && !productList.some(p=>canonProduct(p).key===c.key)){ productList.push(c.name); renderTags(); }
      else if(c.key) toast('Ce produit est déjà dans la liste.');
      input.value = ''; input.focus();
    });
    document.getElementById('newProductName').addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); document.getElementById('addProductBtn').click(); } });
    document.getElementById('mCancel').addEventListener('click', closeModal);
    document.getElementById('modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') closeModal(); });
    document.getElementById('mSave').addEventListener('click', async () => {
      const name = document.getElementById('mName').value.trim();
      if(!name){ toast('Le nom est obligatoire.'); return; }
      await saveClient({ id: isNew ? null : id, name, phone: document.getElementById('mPhone').value.trim(), email: document.getElementById('mEmail').value.trim(), address: document.getElementById('mAddress').value.trim(), notes: document.getElementById('mNotes').value.trim(), tracking: ({yes:true,no:false})[document.getElementById('mTracking').value] ?? null, products: uniqueProducts(productList) });
      learnProducts(productList);
      closeModal(); renderClients();
    });
    const mMerge = document.getElementById('mMerge');
    if(mMerge) mMerge.addEventListener('click', () => {
      const me = clients.find(x => x.id === id); if(!me) return;
      const others = clients.filter(x => x.id !== id).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
      let sel = null;
      askChoice(`<p style="margin:0 0 8px;"><strong>${escapeHtml(me.name)}</strong> (client saisi par erreur ?) sera fusionné dans :</p>
        <select id="mgTarget">${others.map(x => `<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('')}</select>
        <div class="hint" style="margin-top:8px;">Ses ${clientOrders.length} commande${clientOrders.length>1?'s':''} et ses produits habituels passent au client choisi, puis « ${escapeHtml(me.name)} » est supprimé.</div>`, [
        { label:'Fusionner', cls:'btn-main', onClick: async () => {
          const target = clients.find(x => x.id === sel.value); if(!target) return;
          await mergeClients(me, target); closeModal(); renderClients(); toast('Clients fusionnés.');
        } }, { label:'Annuler' }]);
      sel = document.getElementById('mgTarget');
    });
    if(!isNew){
      document.getElementById('mDelete').addEventListener('click', async () => {
        if(clientOrders.length){ toast("Ce client a des commandes enregistrées ; supprime-les d'abord."); return; }
        askConfirm('Supprimer ce client ?', async () => { await deleteClientDb(id); closeModal(); renderClients(); });
      });
    }
  }

  // ---------- gestion des produits (renommer / fusionner) ----------
  function productUsage(){
    const use = {};
    const add = (name, kind) => { const c = canonProduct(name); if(!c.key) return; const u = use[c.key] = use[c.key] || { orders:0, clients:0, spells:{} }; u[kind]++; u.spells[capFirst(name)] = 1; };
    orders.forEach(o => (o.items||[]).forEach(it => add(it.name, 'orders')));
    clients.forEach(c => (c.products||[]).forEach(p => add(p, 'clients')));
    return use;
  }
  function openProductManager(){
    const use = productUsage();
    const list = catalogList();
    const root = document.getElementById('modalRoot');
    root.innerHTML = `<div class="modal-bg" id="pmBg"><div class="modal">
      <h3>Produits</h3>
      <div class="hint" style="margin-bottom:10px;">Une seule écriture officielle par produit. Les majuscules, accents, pluriels et « de / d' » sont déjà ignorés automatiquement. Utilise <strong>Fusionner</strong> pour deux noms vraiment différents (ex. « tradition » et « baguette tradition »).</div>
      <input type="text" id="pmSearch" placeholder="Rechercher un produit…" style="margin-bottom:10px;">
      <div id="pmList"></div>
      <div class="modal-actions"><button class="btn-ghost" id="pmClose" style="width:100%;">Fermer</button></div>
    </div></div>`;
    function draw(){
      const q = normKey(document.getElementById('pmSearch').value);
      document.getElementById('pmList').innerHTML = list.filter(p => !q || p.key.includes(q)).map(p => {
        const u = use[p.key] || { orders:0, clients:0, spells:{} };
        const others = Object.keys(u.spells).filter(x => x !== p.name);
        return `<div style="padding:8px 0;border-bottom:1px solid var(--border);">
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;"><strong style="flex:1;min-width:120px;">${escapeHtml(p.name)}</strong>
            <button class="btn-ghost pmRen" data-k="${escapeHtml(p.key)}" style="padding:3px 10px;font-size:12px;">Renommer</button>
            <button class="btn-ghost pmMer" data-k="${escapeHtml(p.key)}" style="padding:3px 10px;font-size:12px;">Fusionner</button></div>
          <div class="hint" style="margin:2px 0 0;">${u.orders} ligne${u.orders>1?'s':''} de commande · ${u.clients} client${u.clients>1?'s':''}${others.length ? ` · aussi écrit : ${others.map(escapeHtml).join(', ')}` : ''}</div>
        </div>`;
      }).join('') || '<div class="hint">Aucun produit.</div>';
      document.querySelectorAll('.pmRen').forEach(b => b.addEventListener('click', () => pmRename(b.dataset.k)));
      document.querySelectorAll('.pmMer').forEach(b => b.addEventListener('click', () => pmMerge(b.dataset.k)));
    }
    function reopen(){ openProductManager(); }
    function pmRename(k){
      const cur = buildCatalog()[k];
      let inp = null;
      askChoice(`<p style="margin:0 0 8px;">Nouveau nom pour <strong>${escapeHtml(cur)}</strong> :</p><input type="text" id="pmNewName" value="${escapeHtml(cur)}">`, [
        { label:'Renommer', cls:'btn-main', onClick: async () => {
          const nn = capFirst(inp.value);
          if(!nn) return;
          const nk = normKey(nn);
          if(nk !== k && buildCatalog()[nk]){ toast('Ce nom existe déjà : utilise Fusionner.'); return; }
          const al = Object.assign({}, prodSettings.aliases || {});
          Object.keys(al).forEach(a => { if(normKey(al[a]) === k) al[a] = nn; });
          if(nk !== k) al[k] = nn;
          prodSettings.aliases = al;
          prodSettings.names = (prodSettings.names||[]).filter(n => normKey(n) !== k).concat([nn]);
          await saveProdSettings(); logAction('Produit renommé', `${cur} → ${nn}`); toast('Renommé.'); reopen();
        } }, { label:'Annuler' }]);
      inp = document.getElementById('pmNewName');
    }
    function pmMerge(k){
      const cat = buildCatalog(), cur = cat[k];
      const opts = catalogList().filter(p => p.key !== k);
      let sel = null;
      askChoice(`<p style="margin:0 0 8px;"><strong>${escapeHtml(cur)}</strong> sera compté comme :</p><select id="pmTarget">${opts.map(p => `<option value="${escapeHtml(p.key)}">${escapeHtml(p.name)}</option>`).join('')}</select><div class="hint" style="margin-top:8px;">Dans les totaux, le récap, l'impression et les formulaires, « ${escapeHtml(cur)} » deviendra le produit choisi (anciennes commandes comprises).</div>`, [
        { label:'Fusionner', cls:'btn-main', onClick: async () => {
          const tk = sel.value, target = cat[tk];
          if(!target) return;
          const al = Object.assign({}, prodSettings.aliases || {});
          Object.keys(al).forEach(a => { if(normKey(al[a]) === k) al[a] = target; });
          al[k] = target;
          prodSettings.aliases = al;
          prodSettings.names = (prodSettings.names||[]).filter(n => normKey(n) !== k).concat(prodSettings.names.some(n => normKey(n) === tk) ? [] : [target]);
          await saveProdSettings(); logAction('Produits fusionnés', `${cur} → ${target}`); toast('Fusionné.'); reopen();
        } }, { label:'Annuler' }]);
      sel = document.getElementById('pmTarget');
    }
    document.getElementById('pmSearch').addEventListener('input', draw);
    document.getElementById('pmClose').addEventListener('click', closeModal);
    document.getElementById('pmBg').addEventListener('click', e => { if(e.target.id==='pmBg') closeModal(); });
    draw();
  }
  function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

  // ---------- nav ----------
  document.querySelector('nav.tabs').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; if(editingOrderId && b.dataset.tab !== currentTab){ resetDraft(); mobileFormOpen = false; } currentTab=b.dataset.tab; render(); });
  document.getElementById('fab').addEventListener('click', () => { mobileFormOpen = true; renderCommandes(); window.scrollTo({top:0, behavior:'smooth'}); });

  initDb();
})();
</script>
